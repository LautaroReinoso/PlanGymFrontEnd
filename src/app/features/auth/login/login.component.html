<!-- ─────────────────────────────────────────────
     GymPlan — Login Template
     Dos modos: Entrenador (mail + contraseña) y Alumno (solo DNI).
     Usa gp-input y gp-button del shared.
───────────────────────────────────────────── -->
<div class="login-page">

  <!-- Fondo con líneas de grilla animadas -->
  <div class="grid-bg" aria-hidden="true">
    <div class="grid-line" *ngFor="let i of [0,1,2,3,4]"></div>
  </div>

  <!-- Panel central -->
  <main class="login-panel">

    <!-- Logo / Marca -->
    <header class="login-header">
      <div class="logo-mark" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="10" fill="var(--color-accent)"/>
          <rect x="6"  y="15" width="6"  height="6" rx="2" fill="white"/>
          <rect x="24" y="15" width="6"  height="6" rx="2" fill="white"/>
          <rect x="11" y="17" width="14" height="2" rx="1" fill="white"/>
        </svg>
      </div>
      <h1 class="logo-name">GymPlan</h1>
      <p class="login-subtitle">
        {{ isStudentMode() ? 'Ingresá con tu DNI para ver tu plan' : 'Accedé a tu cuenta' }}
      </p>
    </header>

    <!-- Selector de modo -->
    <div
      class="mode-switch"
      [class.is-student]="isStudentMode()"
      role="tablist"
      aria-label="Tipo de acceso"
    >
      <span class="mode-indicator" aria-hidden="true"></span>

      <button
        type="button"
        role="tab"
        class="mode-tab"
        [class.active]="!isStudentMode()"
        [attr.aria-selected]="!isStudentMode()"
        (click)="setMode('trainer')"
      >
        Entrenador
      </button>

      <button
        type="button"
        role="tab"
        class="mode-tab"
        [class.active]="isStudentMode()"
        [attr.aria-selected]="isStudentMode()"
        (click)="setMode('student')"
      >
        Alumno
      </button>
    </div>

    <!-- ── Formulario ENTRENADOR ─────────────── -->
    @if (!isStudentMode()) {
      <form
        class="login-form"
        [class.switched]="switched()"
        [formGroup]="trainerForm"
        (ngSubmit)="onSubmit()"
        novalidate
      >

        <gp-input
          label="Correo electrónico"
          type="email"
          autocomplete="email"
          formControlName="mail"
          [errorMsg]="mailError()"
        />

        <gp-input
          label="Contraseña"
          type="password"
          autocomplete="current-password"
          formControlName="password"
          [errorMsg]="passwordError()"
        />

        <ng-container *ngTemplateOutlet="serverError" />

        <gp-button
          type="submit"
          variant="primary"
          size="lg"
          [loading]="isLoading()"
          [fullWidth]="true"
        >
          Ingresar
        </gp-button>

      </form>

      <!-- Registro (solo entrenadores) -->
      <p class="register-prompt">
        ¿No tenés cuenta?
        <a [routerLink]="['/register']" class="register-link">Registrarse</a>
      </p>
    }

    <!-- ── Formulario ALUMNO ─────────────────── -->
    @if (isStudentMode()) {
      <form
        class="login-form"
        [class.switched]="switched()"
        [formGroup]="studentForm"
        (ngSubmit)="onSubmit()"
        novalidate
      >

        <!-- type="tel" abre el teclado numérico en el celular -->
        <gp-input
          label="DNI"
          type="tel"
          autocomplete="off"
          hint="Solo números, sin puntos"
          formControlName="dni"
          [errorMsg]="dniError()"
        />

        <ng-container *ngTemplateOutlet="serverError" />

        <gp-button
          type="submit"
          variant="primary"
          size="lg"
          [loading]="isLoading()"
          [fullWidth]="true"
        >
          Ingresar
        </gp-button>

      </form>

      <p class="register-prompt">
        ¿Tu DNI no funciona? Pedile a tu entrenador que te dé de alta.
      </p>
    }

  </main>
</div>

<!-- Error global del servidor (compartido por ambos formularios) -->
<ng-template #serverError>
  <div *ngIf="errorMessage()" class="server-error" role="alert">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    {{ errorMessage() }}
  </div>
</ng-template>
