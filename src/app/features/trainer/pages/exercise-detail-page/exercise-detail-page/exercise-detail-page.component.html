<!-- ExerciseDetailPage -->
<div class="detail-page">

  <!-- ── Back ── -->
  <button class="back-btn" (click)="goBack()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M15 18l-6-6 6-6" />
    </svg>
    Ejercicios
  </button>

  <!-- ── Error global ── -->
  @if (error()) {
    <div class="error-banner" role="alert">{{ error() }}</div>
  }

  <!-- ── Skeleton ── -->
  @if (isLoading()) {
    <div class="detail-skeleton">
      <app-gym-loader [size]="48" />
    </div>
  }

  <!-- ── Contenido: info general (compartida con Student) ── -->
  @if (!isLoading() && exercise(); as ex) {

    <app-exercise-detail [exercise]="ex" />

    <!-- Acciones (exclusivas de Trainer) -->
    <div class="detail-actions">
      @if (ex.canCreateVariant) {
        <gp-button variant="secondary" size="md" [loading]="isSaving() && !ex.canEdit" (click)="onCreateVariant()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Crear variante
        </gp-button>
      }
      <gp-button variant="primary" size="md" (click)="onUseInTemplate()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Usar en plantilla
      </gp-button>
      @if (ex.canEdit) {
        <gp-button variant="ghost" size="md" (click)="onEdit()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Editar
        </gp-button>
        <gp-button variant="danger" size="md" [loading]="isSaving()" (click)="onDelete()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/>
          </svg>
          Eliminar
        </gp-button>
      }
    </div>

  }

</div>

<app-exercise-form-modal
  [isOpen]="isModalOpen()"
  [editingExercise]="exercise()"
  [submitting]="isSaving()"
  (closed)="onModalClosed()"
  (save)="onSaveExercise($event)"
/>
