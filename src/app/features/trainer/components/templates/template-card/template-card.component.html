<!-- TemplateCard — diseño colorido con gradientes por acento -->
<button
  class="template-card"
  [class]="'template-card template-card--' + accent()"
  (click)="onClick()"
  type="button"
>
  <!-- Línea de acento superior -->
  <span class="card-accent-line" aria-hidden="true"></span>

  <!-- Nombre -->
  <h3 class="card-name">{{ template().name }}</h3>

  <!-- Descripción -->
  @if (template().description) {
    <p class="card-description">{{ template().description }}</p>
  } @else {
    <p class="card-description card-description--empty">Sin descripción</p>
  }

  <!-- Footer: stats + alumnos -->
  <div class="card-footer">
    <div class="card-stats">

      <!-- Días -->
      <div class="stat">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8"  y1="2" x2="8"  y2="6"/>
          <line x1="3"  y1="10" x2="21" y2="10"/>
        </svg>
        {{ template().dayCount }} {{ template().dayCount === 1 ? 'día' : 'días' }}
      </div>

      <!-- Ejercicios -->
      @if (template().exerciseCount !== undefined) {
        <span class="stat-dot" aria-hidden="true"></span>
        <div class="stat">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <path d="M6 18h2M16 18h2M4 14h16M4 10h16M6 6h2M16 6h2M8 6v12M18 6v12"/>
          </svg>
          {{ template().exerciseCount }} ejercicios
        </div>
      }

    </div>

    <!-- Alumnos asignados -->
    @if (template().assignedStudents !== undefined) {
      <div class="card-students">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        {{ template().assignedStudents }}
      </div>
    }
  </div>

</button>
