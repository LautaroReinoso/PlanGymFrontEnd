<!-- TemplateDay -->
<section class="day-card">

  <!-- ── Header del día ── -->
  <header class="day-header">
    <div class="day-title-group">
      <span class="day-number">{{ day().dayNumber }}</span>
      <h3 class="day-name">{{ day().name }}</h3>
    </div>

    @if (!readonly()) {
      <div class="day-actions">
        <gp-icon-button icon="edit"   variant="ghost" (click)="onEditDay()"/>
        <gp-icon-button icon="delete" variant="ghost" (click)="onRemoveDay()"/>
      </div>
    }
  </header>

  <!-- ── Lista de ejercicios ── -->
  @if (day().exercises.length === 0) {
    <p class="day-empty">Sin ejercicios todavía.</p>
  } @else {
    <ul
      class="exercise-list"
      cdkDropList
      [cdkDropListDisabled]="readonly()"
      (cdkDropListDropped)="onDrop($event)"
    >
      @for (de of day().exercises; track de.id; let i = $index) {
        <app-exercise-item
          class="exercise-row"
          cdkDrag
          [cdkDragDisabled]="readonly()"
          [cdkDragStartDelay]="{ mouse: 0, touch: 200 }"
          [index]="i + 1"
          [name]="de.exerciseName"
          [muscleGroup]="de.primaryMuscle"
          [detail]="summary(de)"
          [showRemove]="!readonly()"
          (remove)="onRemoveExercise(de.id)"
        />
      }
    </ul>
  }

  <!-- ── Agregar ejercicio — solo editable ── -->
  @if (!readonly()) {
    <gp-button variant="ghost" size="sm" [fullWidth]="true" (click)="onAddExercise()">
      + Agregar ejercicio
    </gp-button>
  }

</section>
