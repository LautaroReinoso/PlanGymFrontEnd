<!-- ─────────────────────────────────────────────
     GymPlan — Sidebar Template
───────────────────────────────────────────── -->
<aside class="sidebar" [class.sidebar--open]="isOpen()">

  <!-- ── Header ──────────────────────────────── -->
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
        <rect width="36" height="36" rx="10" fill="#4F6EF7"/>
        <rect x="6"  y="15" width="6"  height="6" rx="2" fill="white"/>
        <rect x="24" y="15" width="6"  height="6" rx="2" fill="white"/>
        <rect x="11" y="17" width="14" height="2" rx="1" fill="white"/>
      </svg>
      <span class="sidebar-logo-name">GymPlan</span>
    </div>

    <!-- Botón cerrar en mobile -->
    <button
      class="sidebar-close-btn"
      (click)="onClose()"
      aria-label="Cerrar menú"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6"  y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- ── Sección: label ───────────────────────── -->
  <div class="sidebar-section-label">Menú</div>

  <!-- ── Nav items ───────────────────────────── -->
  <nav class="sidebar-nav" aria-label="Navegación principal">
    @for (item of navItems; track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: false }"
        (click)="onClose()"
        [attr.aria-label]="item.label"
      >
        <span class="nav-item-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path [attr.d]="item.icon"/>
          </svg>
        </span>
        <span class="nav-item-label">{{ item.label }}</span>
        <span class="nav-item-indicator" aria-hidden="true"></span>
      </a>
    }
  </nav>

  <!-- ── Spacer ───────────────────────────────── -->
  <div class="sidebar-spacer"></div>

  <!-- ── Sección: usuario ─────────────────────── -->
  <div class="sidebar-section-label">Cuenta</div>

  <div class="sidebar-user">
    <div class="user-avatar" aria-hidden="true">
      {{ userInitials }}
    </div>
    <div class="user-info">
      <span class="user-mail">{{ userMail() }}</span>
      <span class="user-role">Entrenador</span>
    </div>
  </div>

  <button
    class="logout-btn"
    (click)="onLogout()"
    aria-label="Cerrar sesión"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    Cerrar sesión
  </button>

</aside>
