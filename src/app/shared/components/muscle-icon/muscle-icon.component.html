<svg
  [attr.width]="width()"
  [attr.height]="height()"
  [attr.viewBox]="viewBox()"
  role="img"
  [attr.aria-label]="label()"
>
  @for (layer of layers(); track layer.view) {
    <g [attr.transform]="'translate(' + layer.dx + ',0)'">
      <!-- Silueta -->
      <ellipse class="s" cx="50" cy="14.5" rx="8.5" ry="10.5" />
      <path class="s" d="M45,23 L55,23 L56.5,32 L43.5,32 Z" />
      <path class="s" [attr.d]="silhouette" />
      <path class="s" [attr.d]="silhouette" [attr.transform]="mirror" />

      <!-- Zonas sin grupo propio -->
      @for (d of layer.neutral; track $index) {
        <path class="n" [attr.d]="d" />
        <path class="n" [attr.d]="d" [attr.transform]="mirror" />
      }

      <!-- Músculos -->
      @for (r of layer.regions; track $index) {
        <path [attr.class]="r.cls" [attr.d]="r.d" />
        <path [attr.class]="r.cls" [attr.d]="r.d" [attr.transform]="mirror" />
      }
    </g>
  }
</svg>
