<!-- ─────────────────────────────────────────────
     GymPlan — InputField Template
     Label flotante: sube cuando hay foco o valor
───────────────────────────────────────────── -->
<div
  class="input-wrapper"
  [class.input-wrapper--focused]="isFocused()"
  [class.input-wrapper--error]="hasError()"
  [class.input-wrapper--disabled]="disabled()"
  [class.input-wrapper--floating]="isFloating()"
>

  <!-- Input nativo -->
  <input
    #inputEl
    class="input-field"
    [type]="inputType()"
    [value]="value()"
    [disabled]="disabled()"
    [autocomplete]="autocomplete()"
    [attr.aria-label]="label()"
    [attr.aria-invalid]="hasError() || null"
    [attr.aria-describedby]="hasError() ? 'hint-' + label() : null"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />

  <!-- Label flotante -->
  <label class="input-label">{{ label() }}</label>

  <!-- Borde de foco animado -->
  <span class="input-focus-line" aria-hidden="true"></span>

  <!-- Icono toggle password -->
  @if (type() === 'password') {
    <button
      type="button"
      class="input-action"
      (click)="togglePassword()"
      [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      tabindex="-1"
    >
      @if (!showPassword()) {
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      } @else {
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      }
    </button>
  }

  <!-- Icono búsqueda -->
  @if (type() === 'search') {
    <span class="input-icon-left" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
    </span>
  }

</div>

<!-- Mensaje de error o hint -->
@if (hasError()) {
  <p class="input-error" [id]="'hint-' + label()" role="alert">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    {{ errorMsg() }}
  </p>
} @else if (hint()) {
  <p class="input-hint">{{ hint() }}</p>
}
